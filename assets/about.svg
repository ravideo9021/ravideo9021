<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img">
<title>About Ravi Deo</title><style>
text{font-family:-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Inter, 'Helvetica Neue', Arial, sans-serif;}
.mono{font-family:'SF Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;}

.ring{transform-box:fill-box;transform-origin:center;animation:ring 3.6s cubic-bezier(0,0,.2,1) infinite;}
@keyframes ring{0%{transform:scale(.3);opacity:.8}100%{transform:scale(1.6);opacity:0}}
.spark{transform-box:fill-box;transform-origin:center;animation:spark 6s ease-in-out infinite;}
@keyframes spark{0%,100%{transform:rotate(0) scale(1)}50%{transform:rotate(45deg) scale(.85)}}

@media (prefers-reduced-motion: reduce){*{animation-duration:0s!important;animation-iteration-count:1!important;}}
</style>
