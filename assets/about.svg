<!-- big tile -->
<text x="48" y="66" class="mono" font-size="12" letter-spacing="2.6" fill="#64D2FF">ABOUT</text>
<text x="46" y="134" font-size="44" font-weight="700" letter-spacing="-1.6" fill="url(#hGrad)">Engineer at the edge of</text>
<text x="46" y="186" font-size="44" font-weight="700" letter-spacing="-1.6" fill="url(#hGrad)">AI, vision &amp; control.</text>
<text x="48" y="246" font-size="18" fill="#A1A1AA">Final-year CS student who likes turning research ideas</text><text x="48" y="275" font-size="18" fill="#A1A1AA">into software that actually runs — sign language read</text><text x="48" y="304" font-size="18" fill="#A1A1AA">straight from a webcam, a digital twin that forecasts</text><text x="48" y="333" font-size="18" fill="#A1A1AA">your week, and controllers that land drones on decks</text><text x="48" y="362" font-size="18" fill="#A1A1AA">that won&#x27;t sit still.</text>
<line x1="48" y1="388" x2="652" y2="388" stroke="#fff" stroke-opacity=".07"/>
<text x="48" y="414" class="mono" font-size="12" fill="#71717A">› python · typescript · c++</text>
<text x="652" y="414" text-anchor="end" class="mono" font-size="12" fill="#71717A">B.Tech CSE · research co-author</text>

