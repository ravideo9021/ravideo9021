<text x="768" y="50" class="mono" font-size="12" letter-spacing="2.6" fill="#BF5AF2">FOCUS</text>
<circle cx="768" cy="86" r="5" fill="#64D2FF"/><circle cx="768" cy="86" r="10" fill="#64D2FF" opacity=".18"/><text x="788" y="92" font-size="17" font-weight="600" fill="#F5F5F7">Computer vision</text><text x="1156" y="92" text-anchor="end" class="mono" font-size="12" fill="#71717A">on-device perception</text><line x1="768" y1="107" x2="1156" y2="107" stroke="#fff" stroke-opacity=".06"/><circle cx="768" cy="126" r="5" fill="#BF5AF2"/><circle cx="768" cy="126" r="10" fill="#BF5AF2" opacity=".18"/><text x="788" y="132" font-size="17" font-weight="600" fill="#F5F5F7">Agentic AI &amp; RAG</text><text x="1156" y="132" text-anchor="end" class="mono" font-size="12" fill="#71717A">LLMs that use tools</text><line x1="768" y1="147" x2="1156" y2="147" stroke="#fff" stroke-opacity=".06"/><circle cx="768" cy="166" r="5" fill="#FFD60A"/><circle cx="768" cy="166" r="10" fill="#FFD60A" opacity=".18"/><text x="788" y="172" font-size="17" font-weight="600" fill="#F5F5F7">Control &amp; robotics</text><text x="1156" y="172" text-anchor="end" class="mono" font-size="12" fill="#71717A">learning-aided UAV control</text>

