<linearGradient id="surf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#111118"/><stop offset="1" stop-color="#09090D"/></linearGradient>
<clipPath id="clip"><rect x="0" y="0" width="1200" height="320" rx="32"/></clipPath><linearGradient id="fGrad" x1="0" y1="120" x2="0" y2="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#B4B4C4"/></linearGradient></defs>
